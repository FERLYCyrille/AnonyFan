<!-- core/templates/base.html -->
{% load static %}
{% load meta_tags %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Anonphoto - Partage de photos anonyme{% endblock %}</title>

    <!-- SEO -->
    <meta name="description"
        content="{% block meta_description %}Téléchargez et partagez des photos en tout anonymat. Obtenez des liens uniques pour chaque image.{% endblock %}">
    <link rel="icon" href="{% static 'core/favicon.png' %}" type="image/png">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="{% meta_title %}" />
    <meta property="og:description" content="{% meta_description %}" />
    <meta property="og:image" content="{% meta_image %}" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% meta_title %}" />
    <meta name="twitter:description" content="{% meta_description %}" />
    <meta name="twitter:image" content="{% meta_image %}" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 60px;
        }

        .card {
            border-radius: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>

</html>
