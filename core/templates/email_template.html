<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Nouveau commentaire</title>
</head>

<body style="font-family:Arial,sans-serif; background-color:#f9f9f9; padding:20px;">
    <div
        style="max-width:600px; margin:auto; background:white; padding:20px; border-radius:5px; box-shadow:0 0 10px rgba(0,0,0,0.05);">
        <h2 style="color:#333;">📩 Nouveau commentaire anonyme reçu</h2>

        <p>Tu as reçu un nouveau commentaire sur ta photo :</p>

        <blockquote style="color:#555; border-left:4px solid #007BFF; padding-left:15px; margin:15px 0;">
            {{ comment_content }}
        </blockquote>

        <p style="text-align:center;">
            <a href="{{ comment_url }}"
                style="background: #fcb69f; color:white; padding:12px 20px; text-decoration:none; border-radius:4px;">
                ➡️ Voir les commentaires
            </a>
        </p>

        <p style="color:#aaa; font-size:12px; text-align:center;">Ce message a été envoyé automatiquement par
            AnonyPhoto.</p>
    </div>
</body>

</html>
