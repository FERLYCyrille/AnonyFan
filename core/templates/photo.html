{% extends 'base.html' %}

{% block title %}Commenter la photo{% endblock %}

{% block content %}
{% if request.GET.sent %}
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="liveToast" class="toast show align-items-center text-white bg-success border-0 shadow" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                🎉 Commentaire envoyé !
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
{% endif %}

<div class="card shadow-lg p-4 mx-auto mt-5 text-center"
    style="max-width: 600px; background: linear-gradient(135deg, #fd9b7a, #ffb199); color: white; border-radius: 15px;">

    <h4 class="mb-3">💬 Laisse un commentaire anonyme</h4>

    <img src="{{ photo.image.url }}" class="img-fluid rounded shadow-sm my-3"
        style="max-height: 280px; object-fit: cover; border: 3px solid white;">

    <form method="post" class="mt-3">
        {% csrf_token %}

        <!-- Custom champ de commentaire -->
        <div class="mb-3">
            <textarea name="content" rows="3" class="form-control shadow-sm" placeholder="Ton commentaire anonyme..."
                required></textarea>
        </div>

        <button class="btn btn-dark w-100 shadow-sm">✉️ Envoyer</button>
    </form>

    <a href="{% url 'upload_photo' %}" class="btn btn-outline-light mt-4 w-100">
        🎲 Jouer vous aussi
    </a>
</div>
{% endblock %}
