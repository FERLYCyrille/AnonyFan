<!-- core/templates/photo.html -->
{% extends 'base.html' %}

{% block title %}Commenter la photo{% endblock %}


{% block content %}
{% if request.GET.sent %}
<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="liveToast" class="toast show align-items-center text-white bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                🎉 Commentaire envoyé !
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
{% endif %}
<div class="card shadow p-4 text-center" style="background-color: #fd9b7a ; color: white;">
    <h4>💬 Laisse un commentaire anonyme</h4>
    <img src="{{ photo.image.url }}" class="img-fluid rounded my-3" style="max-height: 300px; object-fit: contain;">

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-success mt-2">Envoyer</button>
    </form>
    <a href="{% url 'upload_photo' %}" class="btn btn-outline-primary mt-4">Jouer vous aussi </a>


</div>
{% endblock %}
